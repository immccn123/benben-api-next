[package]
name = "takedown"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
thiserror = "2.0"
dotenv = "0.15.0"
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
async-trait = { version = "0.1" }
chrono = "0.4"
entity = { path = "../entity" }
dialoguer = "0.12"
