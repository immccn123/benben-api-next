name: Build and Upload Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build
      run: cargo build --release
    
    - name: Build Meilisearch Writer
      run: cd mili-writer && cargo build --release

    - name: Upload Executable
      uses: actions/upload-artifact@v3
      with:
        name: api-executable
        path: target/release/benben-api-next

    - name: Upload Executable of Meilisearch Writer
      uses: actions/upload-artifact@v3
      with:
        name: api-executable
        path: target/release/mili-writer
