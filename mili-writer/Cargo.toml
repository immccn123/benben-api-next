[package]
name = "mili-writer"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
meilisearch-sdk = "0.33"
entity = { path = "../entity" }
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
dotenvy = "0.15"
tokio = { version = "1.52", features = ["rt", "macros", "rt-multi-thread"] }
chrono = "0.4"
chrono-tz = "0.10"
thiserror = "2.0"
