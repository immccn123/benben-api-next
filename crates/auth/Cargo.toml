[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.3", features = ["derive"] }
dotenvy = "0.15.7"
ecdsa = "0.17.0"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
p256 = { version = "0.14.0", features = ["ecdsa", "arithmetic"] }
pkcs8 = { version = "0.11.0", features = ["pem"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signature = "3.0.0"
sm2 = { version = "0.14.0-rc.15", features = ["dsa", "pem"] }
tera = "2.0.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
url = { version = "2.5.8", features = ["serde"] }
nanoid = "0.4.0"
