<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>认证成功 - 犇站 SSO</title>
        <script>
            const _q = matchMedia("(prefers-color-scheme:dark)");
            document.documentElement.dataset.bsTheme = _q.matches
                ? "dark"
                : "light";
            _q.addEventListener(
                "change",
                (e) =>
                    (document.documentElement.dataset.bsTheme = e.matches
                        ? "dark"
                        : "light"),
            );
        </script>
        <link rel="stylesheet" href="/static/bootstrap.min.css" />
    </head>
    <body
        class="min-vh-100 d-flex align-items-center justify-content-center p-3"
    >
        <div
            class="bg-body-secondary p-4 p-md-5 shadow-sm"
            style="
                max-width: 420px;
                width: 100%;
                border-left: 4px solid var(--bs-success);
            "
        >
            <header class="mb-4">
                <h1
                    class="fw-bold text-uppercase mb-2"
                    style="font-size: 2rem; letter-spacing: -0.03em"
                >
                    Authenticated
                </h1>
                <div class="d-flex align-items-center gap-2">
                    <span
                        class="badge bg-success rounded-0 font-monospace text-uppercase"
                        style="font-size: 10px; letter-spacing: 0.05em"
                        >SUCCESS</span
                    >
                    <span
                        class="font-monospace text-uppercase text-body-tertiary"
                        style="font-size: 11px; letter-spacing: 0.12em"
                        >Identity Verified</span
                    >
                </div>
            </header>

            <main class="d-flex flex-column gap-3">
                <p
                    class="small text-body-secondary mb-0 ps-3 border-start border-2 border-success border-opacity-25"
                    style="line-height: 1.65"
                >
                    欢迎，<span class="text-success fw-bold"
                        >{{ username }}</span
                    >。身份验证已完成。
                </p>
                {% if callback_url and callback_url != "/" %}
                <a
                    href="{{ callback_url }}{% if state %}?state={{ state }}{% endif %}&token={{ jwt }}"
                    class="btn btn-success rounded-0 fw-bold text-uppercase w-100"
                    style="letter-spacing: 0.1em"
                    >返回应用 / RETURN</a
                >
                {% endif %}
            </main>

            <footer
                class="mt-5 pt-3 d-flex justify-content-end align-items-center gap-1"
                style="
                    border-top: 1px solid rgba(var(--bs-body-color-rgb), 0.08);
                "
            >
                <div class="bg-success" style="width: 2rem; height: 3px"></div>
                <div
                    class="bg-success opacity-50"
                    style="width: 0.6rem; height: 3px"
                ></div>
                <div
                    class="bg-success opacity-25"
                    style="width: 0.6rem; height: 3px"
                ></div>
            </footer>
        </div>
    </body>
</html>
