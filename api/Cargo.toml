[package]
name = "benben-api-next"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
entity = { path = "../entity" }

sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

async-trait = { version = "0.1" }

rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"

serde_json = { version = "1" }
serde = "1"

tokio = "1.45"

reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
lazy_static = "1.5"
regex = "1.11"
rand = "0.8"

thiserror = "2.0"
redis = "0.32"
dotenvy = "0.15"
indoc = "2"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "signature"] }
base64 = "0.22.1"
pkcs8 = { version = "0.10.2", features = ["pem"] }

[dependencies.sea-orm-rocket]
version = "0.5.5"
